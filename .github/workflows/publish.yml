name: Publish packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@rogeriobatista"

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # Prefer repo secret NODE_AUTH_TOKEN (PAT with write:packages) when the
      # default GITHUB_TOKEN cannot publish under the @rogeriobatista scope.
      # Never commit tokens — Actions secrets only.
      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for name in \
            @rogeriobatista/core \
            @rogeriobatista/adapter-shared \
            @rogeriobatista/adapter-ts \
            @rogeriobatista/adapter-python \
            @rogeriobatista/adapter-react-vite \
            @rogeriobatista/adapter-node-graphql \
            @rogeriobatista/adapter-terraform \
            @rogeriobatista/adapter-cursor \
            @rogeriobatista/adapter-claude \
            @rogeriobatista/adapter-vscode-copilot \
            @rogeriobatista/cli
          do
            echo "::group::npm publish $name"
            npm publish -w "$name"
            echo "::endgroup::"
          done
