version: 1
# Stack: typescript | ts | python | react-vite | node-graphql | terraform
adapter: typescript
# Optional nested form (adapters.stack overrides adapter when set):
# adapters:
#   stack: python
#   hosts: [cursor]
paths:
  specs: specs
  premises: .sdd/premises.md
  canonical: .sdd/canonical
  plan: .sdd/plan
  devSpec: .sdd/dev-spec.md
  implementationPlan: .sdd/implementation-plan.md
  designApproach: .sdd/design-approach.md
  research: .sdd/research
  runs: .sdd/runs
  demo: .sdd/demo
  evidence: .sdd/evidence
  # Spec Tests (step 2): features default; use tests/spec when preferred
  features: tests/features
  spec: tests/spec
  steps: tests/steps
  unit: tests/unit
  integration: tests/integration
  e2e: tests/e2e
  src: src
runners:
  # Prefer layer keys for verify (step 9). Stack adapters may remap.
  cucumber: npm run sdd:verify:cucumber
  # spec: npm run sdd:verify:cucumber
  # unit: npm run sdd:verify:unit
  # integration: npm run sdd:verify:integration
  playwright: npm run sdd:verify:playwright
  # e2e: npm run sdd:verify:playwright
  all: npm run sdd:verify:all
triggers:
  watch: false
  command: "/sdd run"
loop:
  maxDiagnoseIterations: 3
# Optional: pin the stakeholder evidence pack key (else ticket / auto local id)
# evidence:
#   key: linear:ENG-42
#   historyLimit: 5
# Optional: bootstrap specs from Linear / Jira via `/sdd from-ticket <id>`
# Secrets stay in env vars — only variable *names* belong here.
# ticketing:
#   defaultProvider: linear
#   providers:
#     linear:
#       enabled: true
#       apiKeyEnv: LINEAR_API_KEY
#       defaultTeam: ENG
#     jira:
#       enabled: true
#       baseUrlEnv: JIRA_BASE_URL
#       emailEnv: JIRA_EMAIL
#       apiTokenEnv: JIRA_API_TOKEN
#       defaultProject: SHOP
#       fieldMapping:
#         acceptanceCriteria: customfield_10000
