version: 1
adapter: python
paths:
  specs: specs
  premises: .sdd/premises.md
  canonical: .sdd/canonical
  plan: .sdd/plan
  runs: .sdd/runs
  features: tests/features
  steps: tests/steps
  e2e: tests/e2e
  src: src
runners:
  pytest: pytest -q --junitxml=reports/junit.xml
  all: pytest -q --junitxml=reports/junit.xml
triggers:
  watch: false
  command: "/sdd run"
loop:
  maxDiagnoseIterations: 3
